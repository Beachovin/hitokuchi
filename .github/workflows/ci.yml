# プッシュ・プルリクエストのたびに、型チェック → 自動テスト → ビルドを実行する。
# 本番へのデプロイは Cloudflare Workers Builds が行う（そちらでもビルド前に同じテストが走る）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 型チェック
        run: npm run typecheck
      - name: 自動テスト
        run: npm test
      - name: ビルド
        run: npm run build
