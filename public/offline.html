<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8f1">
<title>オフラインです｜ひとくち</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #fff8f1; color: #1c1917;
         font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 96px; height: 96px; }
  h1 { font-size: 22px; margin: 16px 0 8px; }
  p { color: #78716c; line-height: 1.7; margin: 0; font-size: 14px; }
  button { margin-top: 20px; border: 0; border-radius: 999px; padding: 12px 22px; font: inherit; font-weight: 700; color: #fff;
           background: linear-gradient(135deg, #fbbf24, #f97316); box-shadow: 0 6px 16px rgba(249,115,22,.3); }
</style>
</head>
<body>
  <main>
    <img src="/favicon.svg" alt="">
    <h1>オフラインです</h1>
    <p>インターネットにつながると、<br>最新の新商品と口コミが見られます。</p>
    <button onclick="location.reload()">もう一度読み込む</button>
  </main>
  <script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
